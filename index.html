<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>問題ガチャ</title>
<style>
:root{--ink:#1B1464;--red:#FF4D5E;--blue:#2F80FF;--yel:#FFD93D;--grn:#2ED47A;--pnk:#FF8AD8;--org:#FF9A3C;--bg:#38C3FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);font-weight:700;
background:radial-gradient(circle,#ffffff55 3px,transparent 3.5px) 0 0/34px 34px,var(--bg);min-height:100vh;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:var(--ink);cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
h1{margin:4px 0 6px;flex:0 0 100%;text-align:center;font-size:clamp(26px,min(9vw,13vh),84px);line-height:1.2}
h1 span{display:inline-block;white-space:nowrap;max-width:96vw;letter-spacing:.04em;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 .07em 0 var(--ink);background:linear-gradient(90deg,var(--red),var(--org),var(--yel));border:5px solid var(--ink);border-radius:.33em;padding:.05em .4em;box-shadow:0 8px 0 var(--ink);transform:rotate(-1.5deg)}
#tabs{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.tab{font-size:clamp(18px,2.6vw,28px);padding:6px 20px;border:4px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 5px 0 var(--ink);transition:transform .1s}
.tab.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);background:var(--c)}
.btn{font-size:20px;padding:8px 18px;border:4px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 4px 0 var(--ink)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
main{display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 12px 24px}
#stat{font-size:clamp(18px,2.4vw,28px);background:#fff;border:4px solid var(--ink);border-radius:999px;padding:4px 22px}
#stat b{color:var(--red)}
#stage{position:relative;width:min(78vw,52vh,340px);aspect-ratio:300/430}
#stage svg{width:100%;height:100%;overflow:visible}
#m.shake{animation:shake .15s 6}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px) rotate(-1deg)}75%{transform:translateX(5px) rotate(1deg)}}
#handle{transform-box:fill-box;transform-origin:center;cursor:pointer}
#handle.turn{animation:turn .9s ease-in-out}
@keyframes turn{to{transform:rotate(360deg)}}
.ball{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.capsule{position:absolute;width:26%;aspect-ratio:1;left:37%;bottom:1%;cursor:pointer;animation:drop .9s cubic-bezier(.3,1.4,.5,1) both;border:0;background:none;padding:0}
.capsule .t,.capsule .b{position:absolute;left:0;width:100%;height:50%;border:4px solid var(--ink);transition:transform .5s,opacity .5s}
.capsule .t{top:0;border-radius:999px 999px 0 0;background:var(--c)}
.capsule .b{bottom:0;border-radius:0 0 999px 999px;background:#fff}
.capsule::after{content:"タップ！";position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:10px;padding:0 8px;font-size:15px;white-space:nowrap;animation:bob .8s infinite}
.capsule.open::after{display:none}
.capsule.open .t{transform:translateY(-60px) rotate(-35deg);opacity:0}
.capsule.open .b{transform:translateY(40px) rotate(25deg);opacity:0}
@keyframes drop{0%{transform:translateY(-190%) scale(.3) rotate(0)}60%{transform:translateY(0) scale(1.1) rotate(300deg)}100%{transform:translateY(0) scale(1) rotate(360deg)}}
#spin{font-size:clamp(24px,3.4vw,38px);padding:12px 40px;background:var(--red);color:#fff;text-shadow:0 2px 0 var(--ink);animation:pulse 1.2s infinite}
#spin:disabled{animation:none}
@keyframes pulse{50%{transform:scale(1.06)}}
#fin{display:none;text-align:center;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:14px 22px;box-shadow:0 6px 0 var(--ink);font-size:clamp(18px,2.4vw,28px)}
#fin p{margin:4px 0 12px}
#fin .btn{margin:4px}
#ov{position:fixed;inset:0;background:#1B146499;display:none;align-items:center;justify-content:center;padding:14px;z-index:5}
#ov.show{display:flex}
#card{width:min(94vw,760px);perspective:1400px;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}}
#inner{display:grid;transition:transform .7s;transform-style:preserve-3d}
#card.flip #inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:5px solid var(--ink);border-radius:26px;background:#fff;padding:20px 24px;min-height:min(56vh,420px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;box-shadow:0 8px 0 var(--ink)}
.face.f{border-top:26px solid var(--c)}
.face.k{transform:rotateY(180deg);background:#FFF6C2}
.tag{align-self:flex-start;background:var(--c);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:0 14px;font-size:18px;text-shadow:0 1px 0 var(--ink)}
.txt{font-size:clamp(24px,4.6vw,46px);line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.face img{max-width:100%;max-height:34vh;border:3px solid var(--ink);border-radius:12px;object-fit:contain}
.row{display:flex;gap:14px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.row .btn{font-size:clamp(20px,3vw,32px);padding:10px 28px}
.ok{background:var(--grn)}.ng{background:var(--org)}
.conf{position:fixed;font-size:34px;pointer-events:none;z-index:9;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
#ed{position:fixed;inset:0;background:#1B1464cc;display:none;z-index:8;overflow:auto;padding:12px}
#ed.show{display:block}
.pnl{max-width:820px;margin:0 auto;background:#fff;border:5px solid var(--ink);border-radius:22px;padding:16px}
.pnl h2{margin:0 0 8px;font-size:24px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.bar .btn{font-size:16px;padding:5px 12px}
.qi{display:flex;gap:8px;align-items:center;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;margin:6px 0;background:#F4FBFF}
.qi span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.qi .btn{font-size:15px;padding:2px 9px;box-shadow:0 3px 0 var(--ink)}
.qi img{height:34px;border-radius:6px}
#sync{font-size:clamp(14px,1.8vw,20px);background:#ffffffdd;border:3px solid var(--ink);border-radius:999px;padding:2px 16px}#sync:empty{display:none}
input[type=text],input[type=password],textarea,select{width:100%;font:inherit;font-size:17px;border:3px solid var(--ink);border-radius:10px;padding:8px;margin:4px 0;color:var(--ink)}
label{font-size:15px;display:block;margin-top:6px}
#pv{max-height:120px;display:none;margin:6px 0;border-radius:8px;border:3px solid var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important;animation-iteration-count:1!important}}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<header>
  <h1><span>🎰 問題ガチャ</span></h1>
  <div id="tabs" role="tablist"></div>
  <button class="btn" id="syncBtn">🔄 同期</button>
  <button class="btn" id="edBtn">⚙️ 先生用</button>
</header>
<main>
  <div id="stat"></div>
  <div id="sync" role="status"></div>
  <div id="stage">
    <svg id="m" viewBox="0 0 300 430" aria-label="ガチャガチャ">
      <ellipse cx="150" cy="352" rx="120" ry="14" fill="#1B146433"/>
      <rect x="55" y="170" width="190" height="175" rx="22" fill="#FF4D5E" stroke="#1B1464" stroke-width="6"/>
      <rect x="55" y="320" width="190" height="25" rx="10" fill="#FFD93D" stroke="#1B1464" stroke-width="6"/>
      <circle cx="150" cy="115" r="98" fill="#E8F8FF" stroke="#1B1464" stroke-width="6"/>
      <g id="balls">
        <circle class="ball" cx="105" cy="140" r="26" fill="#2F80FF" stroke="#1B1464" stroke-width="4"/>
        <circle class="ball" cx="160" cy="150" r="26" fill="#FFD93D" stroke="#1B1464" stroke-width="4" style="animation-delay:-.7s"/>
        <circle class="ball" cx="200" cy="120" r="24" fill="#2ED47A" stroke="#1B1464" stroke-width="4" style="animation-delay:-1.3s"/>
        <circle class="ball" cx="128" cy="92" r="24" fill="#FF8AD8" stroke="#1B1464" stroke-width="4" style="animation-delay:-.3s"/>
        <circle class="ball" cx="178" cy="84" r="22" fill="#FF9A3C" stroke="#1B1464" stroke-width="4" style="animation-delay:-1.8s"/>
        <circle class="ball" cx="92" cy="104" r="20" fill="#FF4D5E" stroke="#1B1464" stroke-width="4" style="animation-delay:-1s"/>
      </g>
      <path d="M75 70 Q100 30 140 22" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" opacity=".8"/>
      <circle cx="150" cy="232" r="42" fill="#fff" stroke="#1B1464" stroke-width="6"/>
      <g id="handle"><rect x="108" y="224" width="84" height="16" rx="8" fill="#2F80FF" stroke="#1B1464" stroke-width="5"/><circle cx="150" cy="232" r="11" fill="#FFD93D" stroke="#1B1464" stroke-width="4"/></g>
      <rect x="105" y="288" width="90" height="48" rx="16" fill="#1B1464"/>
      <rect x="112" y="294" width="76" height="30" rx="12" fill="#3a2f9c"/>
    </svg>
  </div>
  <button class="btn" id="spin">ガチャを回す！</button>
  <div id="fin"></div>
</main>

<div id="ov"><div id="card">
  <div id="inner">
    <div class="face f" id="front"><span class="tag">もんだい</span><div class="txt" id="qt"></div><img id="qi" alt=""></div>
    <div class="face k"><span class="tag">こたえ</span><div class="txt" id="at"></div></div>
  </div>
  <div class="row">
    <button class="btn" id="showA" style="background:var(--yel)">答えを見る</button>
    <button class="btn ok" id="okB" hidden>⭕ できた</button>
    <button class="btn ng" id="ngB" hidden>❌ もう一度</button>
  </div>
</div></div>

<div id="ed"><div class="pnl">
  <h2>⚙️ 先生用：問題の管理</h2>
  <div style="border:3px dashed var(--ink);border-radius:12px;padding:8px 10px;margin-bottom:8px">
    <b>☁ GAS同期</b>
    <input type="text" id="gUrl" placeholder="GAS ウェブアプリURL（https://script.google.com/…/exec）">
    <input type="password" id="gKey" placeholder="書き込みキー（送信するときだけ必要）">
    <div class="bar">
      <button class="btn" id="gSave">設定を保存</button>
      <button class="btn" id="gGet">🔄 GASから取得</button>
      <button class="btn ok" id="gPut">⬆ GASへ送信</button>
    </div>
  </div>
  <div class="bar">
    <button class="btn" id="exp">📤 書き出し</button>
    <button class="btn" id="imp">📥 読み込み</button>
    <button class="btn" id="addS">＋教科</button>
    <button class="btn" id="delS">教科を削除</button>
    <button class="btn" id="closeEd" style="margin-left:auto;background:var(--yel)">✖ 閉じる</button>
    <input type="file" id="impF" accept=".json,application/json" hidden>
  </div>
  <select id="edSub" aria-label="教科"></select>
  <div id="list"></div>
  <hr>
  <b id="formT">問題を追加</b>
  <label>問題文<textarea id="fq" rows="3"></textarea></label>
  <label>答え・解説<textarea id="fa" rows="3"></textarea></label>
  <label>画像（任意）<input type="file" id="fi" accept="image/*"></label>
  <label>画像URL（任意）<input type="text" id="fu" placeholder="https://…"></label>
  <img id="pv" alt="">
  <div class="bar">
    <button class="btn ok" id="fsave">保存</button>
    <button class="btn" id="fclr">画像を外す</button>
    <button class="btn" id="fcancel">クリア</button>
  </div>
</div></div>

<script>
const DEFAULT_GAS_URL=''; /* ここにGASのURLを貼ると、児童の端末で設定が不要になります */
const KEY='flashcard.v1', COLORS=['#FF4D5E','#2F80FF','#FFD93D','#2ED47A','#FF8AD8','#FF9A3C'];
const uid=()=>Math.random().toString(36).slice(2,9);
const $=id=>document.getElementById(id);
const mk=(q,a)=>({id:uid(),q,a,img:''});
const SAMPLE=()=>({
 '国語':[mk('「はる」「なつ」「あき」「ふゆ」を まとめて何という？','(例)四季（しき）'),mk('「いちご」を漢字で書こう。','(例)苺'),mk('「つくえ」のように ものの名前を表すことばを何という？','(例)名詞（めいし）')],
 '社会':[mk('日本でいちばん高い山は？','(例)富士山（3776m）'),mk('都道府県は全部でいくつ？','(例)47（1都1道2府43県）')],
 '算数':[mk('7 × 8 = ?','56'),mk('3/4 + 1/4 = ?','1'),mk('正方形の辺は何本？角はいくつ？','辺4本・角4つ（すべて直角）')],
 '理科':[mk('植物が日光を浴びてつくるものは？','(例)でんぷん（養分）'),mk('水は何℃でこおる？','(例)0℃')]
});
let data=load(), subj=Object.keys(data)[0], sess={}, editId=null, imgData='', busy=false, curQ=null;

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&typeof d==='object'&&Object.keys(d).length)return d}catch(e){}return SAMPLE()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('保存できませんでした。画像が大きすぎるかもしれません。')}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newS(s){const p=shuffle((data[s]||[]).map(q=>q.id));return sess[s]={pool:p,wrong:[],total:p.length,ok:0,cur:null}}
const S=()=>sess[subj]||newS(subj);
const colorOf=s=>COLORS[Object.keys(data).indexOf(s)%COLORS.length];
function h(t,p,...c){const e=document.createElement(t);Object.assign(e,p||{});c.forEach(x=>e.append(x));return e}

function renderTabs(){
  const t=$('tabs');t.innerHTML='';
  Object.keys(data).forEach(s=>{
    const b=h('button',{className:'tab'+(s===subj?' on':''),textContent:s});
    b.style.setProperty('--c',colorOf(s));b.setAttribute('role','tab');
    b.onclick=()=>{if(s===subj||busy)return;const o=S();if(o.cur!=null){o.pool.push(o.cur);o.cur=null}subj=s;render()};
    t.append(b);
  });
}
function render(){
  renderTabs();
  document.querySelectorAll('.capsule').forEach(e=>e.remove());
  const s=S();
  const left=s.pool.length+(s.cur!=null?1:0);
  $('stat').innerHTML=`のこり <b>${left}</b> / ${s.total}　⭕ ${s.ok}　🔁 ${s.wrong.length}`;
  const over=s.total>0&&left===0;
  $('spin').style.display=over?'none':'';
  $('spin').disabled=s.total===0;
  $('spin').textContent=s.total===0?'問題がありません':'ガチャを回す！';
  if(s.cur!=null)placeCapsule(true);
  const f=$('fin');f.style.display=over?'block':'none';
  if(over){
    f.innerHTML='';
    f.append(h('p',{textContent:`🎉 ぜんぶ出たよ！ ⭕ ${s.ok}個 ／ 🔁 要復習 ${s.wrong.length}個`}));
    if(s.wrong.length){const b=h('button',{className:'btn ng',textContent:'🔁 間違えたカプセルだけもう一度回す'});
      b.onclick=()=>{s.pool=shuffle(s.wrong);s.total=s.pool.length;s.wrong=[];s.ok=0;render()};f.append(b)}
    const r=h('button',{className:'btn',textContent:'さいしょから'});r.onclick=()=>{newS(subj);render()};f.append(r);
  }
}
function placeCapsule(still){
  const c=h('button',{className:'capsule'});c.setAttribute('aria-label','カプセルを開ける');
  c.style.setProperty('--c',COLORS[Math.floor(Math.random()*COLORS.length)]);
  if(still)c.style.animation='none';
  c.append(h('div',{className:'t'}),h('div',{className:'b'}));
  c.onclick=()=>openCap(c);$('stage').append(c);
}
function spin(){
  const s=S();if(busy||s.cur!=null||!s.pool.length)return;
  busy=true;$('m').classList.add('shake');$('handle').classList.add('turn');$('spin').disabled=true;
  setTimeout(()=>{$('m').classList.remove('shake')},900);
  setTimeout(()=>{
    $('handle').classList.remove('turn');
    s.cur=s.pool.pop();placeCapsule(false);busy=false;
  },900);
}
function openCap(c){
  if(c.classList.contains('open'))return;
  c.classList.add('open');
  const q=data[subj].find(x=>x.id===S().cur);
  setTimeout(()=>{
    if(!q){S().cur=null;render();return}
    curQ=q;$('qt').textContent=q.q;$('at').textContent=q.a;
    const i=$('qi');if(q.img){i.src=imgSrc(q.img);i.style.display=''}else{i.removeAttribute('src');i.style.display='none'}
    $('front').style.setProperty('--c',c.style.getPropertyValue('--c'));
    $('card').classList.remove('flip');
    $('showA').hidden=false;$('okB').hidden=true;$('ngB').hidden=true;
    $('ov').classList.add('show');
  },550);
}
$('showA').onclick=()=>{$('card').classList.add('flip');$('showA').hidden=true;$('okB').hidden=false;$('ngB').hidden=false};
function judge(ok){
  const s=S();$('ov').classList.remove('show');
  if(ok){s.ok++;burst()}else s.wrong.push(s.cur);
  s.cur=null;render();
}
$('okB').onclick=()=>judge(true);$('ngB').onclick=()=>judge(false);
$('spin').onclick=spin;$('handle').onclick=spin;
function burst(){
  const em=['⭐','🎉','✨','🌟','🎊'];
  for(let i=0;i<18;i++){
    const e=h('span',{className:'conf',textContent:em[i%5]});
    e.style.left='50%';e.style.top='45%';
    e.style.setProperty('--x',(Math.random()*90-45)+'vw');e.style.setProperty('--y',(Math.random()*70-35)+'vh');e.style.setProperty('--r',(Math.random()*720-360)+'deg');
    document.body.append(e);setTimeout(()=>e.remove(),1200);
  }
}

/* ---- 先生用 ---- */
function openEd(){$('gUrl').value=cfg.url||'';$('gKey').value=cfg.key||'';$('ed').classList.add('show');renderEd()}
function renderEd(){
  const sel=$('edSub');sel.innerHTML='';
  Object.keys(data).forEach(s=>sel.append(h('option',{value:s,textContent:s,selected:s===subj})));
  const L=$('list');L.innerHTML='';
  const arr=data[subj];
  if(!arr.length)L.append(h('p',{textContent:'まだ問題がありません。下のフォームから追加しましょう。'}));
  arr.forEach((q,i)=>{
    const r=h('div',{className:'qi'});
    if(q.img)r.append(h('img',{src:imgSrc(q.img),alt:''}));
    r.append(h('span',{textContent:`${i+1}. ${q.q}`}));
    const bt=(t,f,d)=>{const b=h('button',{className:'btn',textContent:t,disabled:!!d,title:t});b.onclick=f;return b};
    r.append(bt('↑',()=>mv(i,-1),i===0),bt('↓',()=>mv(i,1),i===arr.length-1),bt('編集',()=>edit(q)),bt('削除',()=>{if(confirm('この問題を削除しますか？')){arr.splice(i,1);changed()}}));
    L.append(r);
  });
}
function changed(){save();markDirty();newS(subj);renderEd();render()}
function mv(i,d){const a=data[subj];[a[i],a[i+d]]=[a[i+d],a[i]];changed()}
function edit(q){editId=q.id;$('fq').value=q.q;$('fa').value=q.a;setImg(q.img);$('formT').textContent='問題を編集';$('fq').focus()}
function setImg(d){imgData=d||'';const p=$('pv');$('fu').value=/^https?:/.test(imgData)?imgData:'';if(imgData){p.src=imgSrc(imgData);p.style.display='block'}else{p.removeAttribute('src');p.style.display='none'}$('fi').value=''}
function clearForm(){editId=null;$('fq').value='';$('fa').value='';setImg('');$('formT').textContent='問題を追加'}
$('fi').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*k;c.height=im.height*k;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
    setImg(c.toDataURL('image/jpeg',.8));
  };im.src=rd.result};rd.readAsDataURL(f);
};
$('fclr').onclick=()=>setImg('');
$('fcancel').onclick=clearForm;
$('fsave').onclick=()=>{
  const q=$('fq').value.trim(),a=$('fa').value.trim(),u=$('fu').value.trim(),im=/^https?:\/\//.test(u)?u:imgData;
  if(!q||!a){alert('問題文と答えを入力してください。');return}
  if(editId){const t=data[subj].find(x=>x.id===editId);if(t){t.q=q;t.a=a;t.img=im}}
  else data[subj].push({id:uid(),q,a,img:im});
  clearForm();changed();
};
$('edSub').onchange=e=>{subj=e.target.value;clearForm();renderEd();render()};
$('addS').onclick=()=>{const n=(prompt('追加する教科名（例：英語）')||'').trim();if(!n)return;if(data[n]){alert('その教科はすでにあります。');return}data[n]=[];subj=n;save();markDirty();renderEd();render()};
$('delS').onclick=()=>{if(Object.keys(data).length<2){alert('最後の教科は削除できません。');return}
  if(confirm(`「${subj}」の問題をすべて削除しますか？`)){delete data[subj];delete sess[subj];subj=Object.keys(data)[0];save();markDirty();clearForm();renderEd();render()}};
$('exp').onclick=()=>{
  const b=new Blob([JSON.stringify({app:'mondai-gacha',version:1,subjects:data})],{type:'application/json'});
  const a=h('a',{href:URL.createObjectURL(b),download:'mondai-gacha-data.json'});document.body.append(a);a.click();a.remove();
};
$('imp').onclick=()=>$('impF').click();
$('impF').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    const j=JSON.parse(rd.result),src=j.subjects||j,out={};
    Object.keys(src).forEach(k=>{if(!Array.isArray(src[k]))return;out[k]=src[k].filter(x=>x&&typeof x.q==='string'&&typeof x.a==='string').map(x=>({id:uid(),q:x.q,a:x.a,img:typeof x.img==='string'&&/^(data:image\/|https?:\/\/)/.test(x.img)?x.img:''}))});
    if(!Object.keys(out).length)throw 0;
    if(!confirm('いまのデータを読み込んだデータで置き換えます。よろしいですか？'))return;
    data=out;sess={};subj=Object.keys(data)[0];save();markDirty();clearForm();renderEd();render();
  }catch(err){alert('読み込めませんでした。書き出したJSONファイルを選んでください。')}e.target.value=''};
  rd.readAsText(f);
};
$('edBtn').onclick=openEd;
$('closeEd').onclick=()=>{$('ed').classList.remove('show');clearForm();render()};

/* ---- GAS同期 ---- */
let cfg={},ic={};
try{cfg=JSON.parse(localStorage.getItem('mondai.cfg'))||{}}catch(e){}
try{ic=JSON.parse(localStorage.getItem('mondai.ic'))||{}}catch(e){}
const saveCfg=()=>{try{localStorage.setItem('mondai.cfg',JSON.stringify(cfg))}catch(e){}};
const isDirty=()=>localStorage.getItem('mondai.dirty')==='1';
const setDirty=v=>{try{v?localStorage.setItem('mondai.dirty','1'):localStorage.removeItem('mondai.dirty')}catch(e){}};
const imgSrc=u=>ic[u]||u;
const setStat=t=>{$('sync').textContent=t};
const hhmm=()=>new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
function markDirty(){setDirty(true);if(cfg.url)setStat('✏️ 未送信の編集があります（⚙️→GASへ送信）')}
(function(){const g=new URLSearchParams(location.search).get('gas');
  if(g&&/^https:\/\/script\.google\.com\//.test(g)){cfg.url=g;saveCfg()}
  if(!cfg.url&&DEFAULT_GAS_URL){cfg.url=DEFAULT_GAS_URL}})();
function norm(src){
  const out={};
  if(!src||typeof src!=='object')return null;
  Object.keys(src).forEach(k=>{if(!Array.isArray(src[k]))return;
    out[k]=src[k].filter(x=>x&&typeof x.q==='string'&&typeof x.a==='string'&&x.q&&x.a).map(x=>({id:uid(),q:x.q,a:x.a,img:typeof x.img==='string'&&/^(data:image\/|https?:\/\/)/.test(x.img)?x.img:''}))});
  return Object.keys(out).length?out:null;
}
function applyData(out){
  data=out;sess={};if(!data[subj])subj=Object.keys(data)[0];save();render();
  if($('ed').classList.contains('show'))renderEd();
}
async function sync(manual){
  if(!cfg.url){if(manual)alert('先生用画面でGAS URLを登録してください。');return}
  if($('ov').classList.contains('show'))return;
  if(isDirty()){
    if(!manual){setStat('✏️ 未送信の編集があるため、自動同期は行いませんでした');return}
    if(!confirm('未送信の編集があります。GASの内容で上書きしますか？'))return;
  }
  setStat('🔄 同期中…');
  try{
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),10000);
    const r=await fetch(cfg.url+(cfg.url.includes('?')?'&':'?')+'t='+Date.now(),{signal:ctl.signal});
    clearTimeout(t);
    const j=await r.json();
    if(j.error)throw new Error(j.error);
    const out=norm(j.subjects||j);
    if(!out)throw new Error('問題データの形式が正しくありません');
    applyData(out);setDirty(false);setStat('✅ 最新の問題に同期しました '+hhmm());
    cacheImgs();
  }catch(e){setStat('📴 同期できないため、保存済みの問題を使っています')}
}
async function send(){
  if(!cfg.url){alert('先にGAS URLを登録してください。');return}
  if(!cfg.key){alert('書き込みキーを入力して「設定を保存」を押してください。');return}
  if(!confirm('スプレッドシートの内容を、この端末の問題で置き換えます。よろしいですか？'))return;
  setStat('⬆ 送信中…（画像が多いと少し時間がかかります）');
  try{
    const r=await fetch(cfg.url,{method:'POST',body:JSON.stringify({key:cfg.key,subjects:data})});
    const j=await r.json();
    if(j.error)throw new Error(j.error);
    const out=norm(j.subjects);if(out)applyData(out);
    setDirty(false);setStat('✅ GASへ送信しました '+hhmm());cacheImgs();
  }catch(e){setStat('⚠ 送信できませんでした');alert('送信できませんでした：'+e.message)}
}
async function cacheImgs(){
  const urls=new Set();let ch=false;
  Object.values(data).forEach(a=>a.forEach(q=>{if(/^https?:/.test(q.img))urls.add(q.img)}));
  for(const u of urls){
    if(ic[u])continue;
    if(JSON.stringify(ic).length>3.5e6)break;
    try{
      const b=await(await fetch(u)).blob();if(!b.type.startsWith('image/'))continue;
      ic[u]=await new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=ng;r.readAsDataURL(b)});ch=true;
    }catch(e){}
  }
  Object.keys(ic).forEach(k=>{if(!urls.has(k)){delete ic[k];ch=true}});
  if(ch)try{localStorage.setItem('mondai.ic',JSON.stringify(ic))}catch(e){}
}
$('syncBtn').onclick=()=>sync(true);
$('gGet').onclick=()=>{cfg.url=$('gUrl').value.trim();cfg.key=$('gKey').value;saveCfg();sync(true)};
$('gSave').onclick=()=>{cfg.url=$('gUrl').value.trim();cfg.key=$('gKey').value;saveCfg();setStat('設定を保存しました')};
$('gPut').onclick=()=>{cfg.url=$('gUrl').value.trim();cfg.key=$('gKey').value;saveCfg();send()};
window.addEventListener('online',()=>sync(false));
render();sync(false);
</script>
